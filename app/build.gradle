plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pravah.browser'
    compileSdk 34

    defaultConfig {
        applicationId "com.pravah.browser"
        minSdk 26
        targetSdk 34
        versionCode 10
        versionName "1.9"
    }

    // Fixed key (kept in the repo) so every new build can be installed over the previous one.
    signingConfigs {
        release {
            storeFile file('pravah.keystore')
            storePassword 'pravah123'
            keyAlias 'pravah'
            keyPassword 'pravah123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.10.0'
}
