<!doctype html>
<html data-theme="daylight">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="stylesheet" href="theme.css">
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);font-family:system-ui,-apple-system,Roboto,sans-serif;color:var(--text);overflow:hidden;user-select:none;-webkit-user-select:none}
body{padding:8px 10px;display:flex}
#pill{position:relative;flex:1;display:flex;align-items:center;gap:2px;height:44px;border-radius:22px;background:var(--surface);border:1px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.06);overflow:hidden;padding:0 4px 0 4px}
.ic{width:20px;height:20px;fill:currentColor;display:block}
#lk{color:var(--sub);flex:none;margin-right:8px}
#lk.ok{color:#16a34a}
#txt{flex:1;min-width:0;background:none;border:0;text-align:left;color:var(--text);font-weight:600;font-size:15px;font-family:inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:44px}
#txt small{font-weight:500;color:var(--sub);margin-left:8px;font-size:12.5px}
button.b{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:none;color:var(--text);display:flex;align-items:center;justify-content:center}
button.b:active{background:var(--surface2)}
#st.on{color:#F5A524}
#pg{position:absolute;left:0;bottom:0;height:3px;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .15s linear,opacity .25s}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="lock" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></symbol>
<symbol id="refresh" viewBox="0 0 24 24"><path d="M17.65 6.35A7.958 7.958 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A5.99 5.99 0 0 1 12 18a6 6 0 1 1 0-12c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></symbol>
<symbol id="t-home" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></symbol>
<symbol id="t-back" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></symbol>
<symbol id="t-fwd" viewBox="0 0 24 24"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></symbol>
<symbol id="t-plus" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></symbol>
<symbol id="t-puz" viewBox="0 0 24 24"><path d="M20.5 11H19V7c0-1.1-.9-2-2-2h-4V3.5C13 2.12 11.88 1 10.5 1S8 2.12 8 3.5V5H4c-1.1 0-1.99.9-1.99 2v3.8H3.5c1.49 0 2.7 1.21 2.7 2.7s-1.21 2.7-2.7 2.7H2V20c0 1.1.9 2 2 2h3.8v-1.5c0-1.49 1.21-2.7 2.7-2.7 1.49 0 2.7 1.21 2.7 2.7V22H17c1.1 0 2-.9 2-2v-4h1.5c1.38 0 2.5-1.12 2.5-2.5S21.88 11 20.5 11z"/></symbol>
<symbol id="close" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></symbol>
<symbol id="star" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></symbol>
<symbol id="star0" viewBox="0 0 24 24"><path d="M22 9.24l-7.19-.62L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21 12 17.27 18.18 21l-1.63-7.03L22 9.24zM12 15.4l-3.76 2.27 1-4.28-3.32-2.88 4.38-.38L12 6.1l1.71 4.04 4.38.38-3.32 2.88 1 4.28L12 15.4z"/></symbol>
</defs></svg>
<div id="pill">
  <button class="b" id="lb" aria-label="Shortcut"><svg class="ic"><use href="#t-home"/></svg></button>
  <svg class="ic" id="lk"><use href="#lock"/></svg>
  <button id="txt"><span id="host">Search or type URL</span></button>
  <button class="b" id="st" aria-label="Bookmark"><svg class="ic"><use href="#star0"/></svg></button>
  <button class="b" id="rl" aria-label="Reload"><svg class="ic"><use href="#refresh"/></svg></button>
  <div id="pg"></div>
</div>
<script>
const $=s=>document.querySelector(s);
const N=window.Native||{nav(){},topAction(){}};
let loading=false;
const ICONS={home:'#t-home',back:'#t-back',forward:'#t-fwd',newtab:'#t-plus',refresh:'#refresh',extension:'#t-puz',favorites:'#star0'};
const ACT={home:'homeBtn',back:'back',forward:'forward',newtab:'newtab',extension:'extension',favorites:'favorites'};
let barBtn='home',pos='top',swFs=true,swTabs=true,swiped=0;
window.Top={
  setTheme(t){document.documentElement.dataset.theme=t},
  set(o){
    let h='';
    if(o.url){
      if(o.fullUrl)h=String(o.url).replace(/^https?:\/\//,'').replace(/^www\./,'').replace(/\/$/,'');
      else{try{h=new URL(o.url).hostname.replace(/^www\./,'')}catch(e){}}
    }
    $('#host').textContent=h||'Search or type URL';
    barBtn=ACT[o.barBtn]||o.barBtn==='refresh'?o.barBtn:'home';
    pos=o.pos==='bottom'?'bottom':'top';swFs=o.swipeFs!==false;swTabs=o.swipeTabs!==false;
    $('#lb use').setAttribute('href',ICONS[barBtn]||'#t-home');
    $('#lk').classList.toggle('ok',!!o.secure);
    $('#st').classList.toggle('on',!!o.bookmarked);
    $('#st use').setAttribute('href',o.bookmarked?'#star':'#star0');
    loading=!!o.loading;
    $('#rl use').setAttribute('href',loading?'#close':'#refresh');
    const pg=$('#pg');
    if(loading){pg.style.opacity=1;pg.style.width=Math.max(6,o.progress||0)+'%'}
    else{pg.style.width='100%';setTimeout(()=>{pg.style.opacity=0;setTimeout(()=>{pg.style.width='0'},260)},120)}
  }
};
$('#lb').onclick=()=>{if(barBtn==='refresh')N.topAction(loading?'stop':'reload');else N.topAction(ACT[barBtn]||'homeBtn')};
let sx0=0,sy0=0;
$('#pill').addEventListener('touchstart',e=>{const t=e.touches[0];sx0=t.clientX;sy0=t.clientY},{passive:true});
$('#pill').addEventListener('touchend',e=>{
  const t=e.changedTouches[0],dx=t.clientX-sx0,dy=t.clientY-sy0;
  if(Math.abs(dy)<34||Math.abs(dy)<Math.abs(dx)*1.3)return;
  swiped=Date.now();const up=dy<0,fs=pos==='bottom'?!up:up;
  if(fs){if(swFs)N.topAction('fullscreen')}else if(swTabs)N.topAction('tabs');
},{passive:true});
$('#txt').onclick=()=>{if(Date.now()-swiped<400)return;N.nav('search','')};
$('#rl').onclick=()=>N.topAction(loading?'stop':'reload');
$('#st').onclick=()=>N.topAction('bookmark');
</script>
</body>
</html>
