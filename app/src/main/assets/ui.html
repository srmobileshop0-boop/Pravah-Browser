<!doctype html>
<html data-theme="daylight">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="stylesheet" href="theme.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:transparent;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
input{user-select:text;-webkit-user-select:text;font-family:inherit;color:var(--text)}
button{font-family:inherit;color:inherit;cursor:pointer}
.ic{width:24px;height:24px;fill:currentColor;display:block;flex:none}
.page{position:absolute;inset:0;background:var(--bg);display:none;flex-direction:column;overflow:hidden}
.page.on{display:flex;animation:pin .18s ease-out}
@keyframes pin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.scroll{flex:1;overflow-y:auto;padding:0 16px 96px;-webkit-overflow-scrolling:touch}
.hdr{display:flex;align-items:center;gap:6px;padding:10px 8px 6px;flex:none}
.hdr h1{font-size:22px;font-weight:800;letter-spacing:-.3px;flex:1;padding-left:4px}
.ib{width:44px;height:44px;border-radius:50%;border:0;background:none;display:flex;align-items:center;justify-content:center}
.ib:active{background:var(--surface2)}
.field{display:flex;align-items:center;gap:10px;margin:6px 16px 10px;padding:0 14px;height:46px;border-radius:23px;background:var(--surface);border:1px solid var(--line)}
.field input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:16px;height:100%}
.field .ic{color:var(--sub);width:22px;height:22px}
.empty{text-align:center;color:var(--sub);padding:70px 24px;font-size:15px;line-height:1.5}
.empty .ic{width:56px;height:56px;margin:0 auto 14px;opacity:.35}
.empty b{display:block;color:var(--text);font-size:18px;margin-bottom:6px}

/* ---------- Bottom bar ---------- */
#bar{position:fixed;left:10px;right:10px;bottom:10px;height:56px;border-radius:28px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);display:none;align-items:center;justify-content:space-around;z-index:20}
#bar.on{display:flex}
#bar button{width:52px;height:52px;border-radius:50%;border:0;background:none;display:flex;align-items:center;justify-content:center;color:var(--text)}
#bar button:active{background:var(--surface2)}
#bar button[disabled]{opacity:.3}
#bar .fab{width:66px;height:66px;margin-top:-18px;background:var(--head);color:var(--head-text);box-shadow:0 8px 20px rgba(0,0,0,.28)}
#bar .fab:active{background:var(--head);transform:scale(.94)}
.cnt{width:24px;height:24px;border:2px solid currentColor;border-radius:7px;font-size:12px;font-weight:800;line-height:20px;text-align:center;display:block}

/* ---------- Home ---------- */
#p-home::before,#p-home::after,#p-home .blob{content:"";position:absolute;border-radius:50%;pointer-events:none}
#p-home::before{width:130%;height:62%;left:-15%;top:-22%;background:radial-gradient(closest-side,var(--b1),transparent 72%);opacity:.6;animation:drift 15s ease-in-out infinite alternate}
#p-home::after{width:120%;height:55%;left:-10%;bottom:-18%;background:radial-gradient(closest-side,var(--b3),transparent 72%);opacity:.55;animation:drift 19s ease-in-out infinite alternate-reverse}
#p-home .blob{width:90%;height:40%;right:-35%;top:34%;background:radial-gradient(closest-side,var(--b2),transparent 72%);opacity:.45;animation:drift 22s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate3d(-5%,-2%,0) scale(1)}to{transform:translate3d(7%,5%,0) scale(1.14)}}
#p-home>*{position:relative;z-index:1}
.htop{display:flex;justify-content:flex-end;padding:10px 12px 0;flex:none}
.hmain{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 20px 84px;overflow-y:auto}
.brand{display:flex;flex-direction:column;align-items:center;margin-bottom:22px}
.mark{width:78px;height:78px;border-radius:50%;display:grid;place-items:center;box-shadow:0 14px 34px -8px rgba(40,110,255,.6)}
.mark img{width:100%;height:100%;display:block;border-radius:50%}
.word{font-size:44px;font-weight:800;letter-spacing:-1.5px;margin-top:10px;line-height:1.05;background:linear-gradient(110deg,var(--text) 10%,var(--accent) 55%,var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{font-size:11.5px;letter-spacing:2.6px;text-transform:uppercase;color:var(--sub);margin-top:6px;font-weight:600}
.sbox{display:flex;align-items:center;gap:10px;height:56px;border-radius:28px;padding:0 8px 0 18px;background:var(--glass);border:1px solid var(--line);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.sbox .ic{color:var(--sub);width:22px;height:22px}
.sbox input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:16.5px;height:100%}
.sbox input::placeholder{color:var(--sub)}
.sbox .go{width:42px;height:42px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--on-accent);display:flex;align-items:center;justify-content:center}
.engs{display:flex;gap:8px;margin-top:12px}
.eng{flex:1;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:14.5px}
.eng:active{transform:scale(.96)}
.eng.sel{background:var(--surface);border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.fv{position:relative;display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;background:var(--surface2);font-size:11px;font-weight:800;color:var(--sub);overflow:hidden;flex:none}
.fv img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:var(--surface);padding:1px}
.eng .fv{background:none;width:20px;height:20px}
.fbk{display:grid;place-items:center;width:100%;height:100%}.fbk svg{width:100%;height:100%}
.sites{display:flex;flex-wrap:wrap;justify-content:center;gap:20px 0;margin-top:28px}
.tile{width:25%;display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:0;animation:rise .5s both}
.tile:nth-child(2){animation-delay:.04s}.tile:nth-child(3){animation-delay:.08s}.tile:nth-child(4){animation-delay:.12s}.tile:nth-child(5){animation-delay:.16s}.tile:nth-child(6){animation-delay:.2s}.tile:nth-child(7){animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.9)}to{opacity:1;transform:none}}
.tl{position:relative;width:64px;height:64px;border-radius:22px;background:var(--surface);box-shadow:var(--shadow);border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;transition:transform .12s}
.tile:active .tl{transform:scale(.9)}
.tl .fb svg{width:38px;height:38px;display:block}
.tl img{position:absolute;left:12px;top:12px;width:40px;height:40px;object-fit:contain;background:var(--surface);border-radius:9px}
.tn{font-size:12.5px;font-weight:600;color:var(--text)}
.quick{display:flex;justify-content:center;gap:10px;margin-top:26px}
.quick button{display:flex;align-items:center;gap:8px;padding:0 16px;height:38px;border-radius:19px;border:1px solid var(--line);background:var(--glass);font-size:13.5px;font-weight:600;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.quick .ic{width:18px;height:18px;color:var(--accent)}

/* ---------- Tabs ---------- */
.seg{display:flex;gap:4px;padding:4px;border-radius:22px;background:var(--surface2);margin-left:8px}
.seg button{border:0;background:none;height:36px;padding:0 16px;border-radius:18px;font-weight:700;font-size:15px;color:var(--sub);display:flex;align-items:center;gap:6px}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 6px rgba(0,0,0,.12)}
.seg i{font-style:normal;font-size:11.5px;background:var(--accent);color:var(--on-accent);border-radius:9px;min-width:18px;padding:0 5px;height:18px;line-height:18px;display:none}
.seg button.on i{display:inline-block}
#tsearch{display:none}
#tsearch.on{display:flex}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:8px 16px 110px;overflow-y:auto;flex:1;align-content:start}
.tgrid.list{grid-template-columns:1fr;gap:10px}
.priv-note{margin:2px 16px 0;font-size:12.5px;color:var(--sub);display:none}
.privmode .priv-note{display:block}
.card{border-radius:20px;overflow:hidden;background:var(--head);box-shadow:var(--shadow);position:relative;touch-action:none;transition:transform .22s ease,opacity .22s ease;will-change:transform}
.card.act{outline:3px solid var(--accent);outline-offset:-1px}
.chead{display:flex;align-items:center;gap:8px;height:44px;padding:0 4px 0 12px;color:var(--head-text)}
.chead .ttl{flex:1;min-width:0;font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chead .fv{background:rgba(255,255,255,.15);color:#fff}
.chead .fv img{background:#fff;border-radius:5px}
.chead .x{width:38px;height:38px;border:0;border-radius:50%;background:none;color:var(--head-text);display:flex;align-items:center;justify-content:center;flex:none}
.chead .x .ic{width:20px;height:20px}
.cbody{margin:0 5px 5px;border-radius:15px;overflow:hidden;background:var(--bg);aspect-ratio:3/3.9;position:relative}
.list .cbody{display:none}
.list .card{border-radius:18px}
.list .chead{height:60px}
.list .card{touch-action:pan-y}
.cbody img.th{width:100%;height:100%;object-fit:cover;object-position:top;display:block;background:#fff}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:radial-gradient(120% 80% at 20% 0,var(--b1),transparent 60%),radial-gradient(100% 70% at 100% 100%,var(--b3),transparent 60%),var(--bg)}
.ph .mark{width:50px;height:50px}
.ph b{font-size:15px;font-weight:800;color:var(--text);letter-spacing:-.3px}

/* ---------- Lists (history / bookmarks / search) ---------- */
.grp{font-size:12.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--sub);padding:16px 4px 6px}
.row{display:flex;align-items:center;gap:12px;padding:8px 6px;border-radius:14px}
.row:active{background:var(--surface2)}
.row .fv{width:36px;height:36px;border-radius:11px;font-size:15px;background:var(--surface)}
.row .fv img{padding:5px;border-radius:11px;border:1px solid var(--line)}
.row .mid{flex:1;min-width:0}
.row .t{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.row .rb{width:38px;height:38px;border-radius:50%;border:0;background:none;color:var(--sub);display:flex;align-items:center;justify-content:center;flex:none}
.row .rb:active{background:var(--surface2)}
.row .rb .ic{width:20px;height:20px}
.row .sico{width:36px;height:36px;border-radius:11px;background:var(--surface2);display:grid;place-items:center;color:var(--sub);flex:none}
.row .sico .ic{width:20px;height:20px}
.chips{display:flex;gap:8px;padding:0 16px 6px;flex:none;overflow-x:auto}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none}
.chip{height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:7px}
.chip.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}

/* ---------- Settings ---------- */
.sec{font-size:12.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--sub);padding:20px 6px 8px}
.card2{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.set{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;font-size:15.5px}
.set:last-child{border-bottom:0}
.set .lbl{flex:1}
.set .lbl small{display:block;color:var(--sub);font-size:12.5px;margin-top:2px;font-weight:400}
.set .ic{color:var(--accent);width:22px;height:22px}
.set.danger .ic,.set.danger .lbl{color:#E5484D}
.tg{width:46px;height:28px;border-radius:14px;background:var(--surface2);border:1px solid var(--line);position:relative;flex:none;transition:background .15s}
.tg::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:var(--sub);transition:transform .15s,background .15s}
.tg.on{background:var(--accent);border-color:var(--accent)}
.tg.on::after{transform:translateX(18px);background:var(--on-accent)}
.themes{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}
.th{border-radius:16px;border:2px solid var(--line);padding:8px;background:var(--surface);text-align:left}
.th.sel{border-color:var(--accent)}
.th .pv{height:58px;border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:5px;justify-content:center}
.th .pv i{display:block;height:8px;border-radius:4px}
.th .nm{font-weight:700;font-size:13.5px;margin-top:7px;display:flex;align-items:center;justify-content:space-between}
.th .nm .ic{width:18px;height:18px;color:var(--accent);visibility:hidden}
.th.sel .nm .ic{visibility:visible}
.about{text-align:center;color:var(--sub);font-size:13px;line-height:1.6;padding:26px 0 8px}
.about b{color:var(--text)}

/* ---------- Menu sheet ---------- */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:28px 28px 0 0;padding:10px 14px 22px;transform:translateY(105%);transition:transform .24s cubic-bezier(.2,.85,.25,1)}
#scrim.on #sheet{transform:none}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px 4px}
.mi{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:7px;padding:8px 2px;border-radius:16px;font-size:12px;font-weight:600}
.mi .bubble{width:54px;height:54px;border-radius:50%;background:var(--surface2);display:grid;place-items:center}
.mi.on .bubble{background:var(--accent);color:var(--on-accent)}
.mi[disabled]{opacity:.35}
.mi:active .bubble{transform:scale(.92)}
.mrow{display:flex;align-items:center;justify-content:space-between;padding:6px 8px 12px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.mrow span{font-size:13px;font-weight:700;color:var(--sub)}
.dots{display:flex;gap:12px}
.dot{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);position:relative;overflow:hidden;padding:0}
.dot::after{content:"";position:absolute;right:0;bottom:0;width:60%;height:60%;border-radius:50% 0 0 0;background:var(--c2)}
.dot.sel{outline:3px solid var(--accent);outline-offset:2px}

.seg3{display:flex;gap:4px;padding:3px;border-radius:20px;background:var(--surface2)}
.seg3 .tm{border:0;background:none;height:34px;padding:0 12px;border-radius:17px;font-weight:700;font-size:13px;color:var(--sub);display:flex;align-items:center;gap:6px}
.seg3 .tm .ic{width:17px;height:17px}
.seg3 .tm.on{background:var(--accent);color:var(--on-accent)}
.seg3.wide{width:100%}
.seg3.wide .tm{flex:1;justify-content:center;height:40px;border-radius:20px}

/* ---------- Downloads ---------- */
.ft{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:11.5px;font-weight:900;letter-spacing:.3px;color:#fff;flex:none;background:linear-gradient(135deg,var(--c1),var(--c2))}
.ft.video{--c1:#FF6A6F;--c2:#F0285B}.ft.image{--c1:#34D399;--c2:#059669}.ft.audio{--c1:#A78BFA;--c2:#7C3AED}.ft.doc{--c1:#60A5FA;--c2:#2563EB}.ft.app{--c1:#4ADE80;--c2:#16A34A}.ft.zip{--c1:#FBBF24;--c2:#D97706}.ft.file{--c1:#94A3B8;--c2:#64748B}
.row.dl{padding:12px 8px 12px 12px;background:var(--surface);border:1px solid var(--line);border-radius:18px;margin-bottom:10px}
.dl .bar{height:6px;border-radius:3px;background:var(--surface2);margin-top:9px;overflow:hidden}
.dl .bar i{display:block;height:100%;width:0;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .6s linear}
.dl .bar.ind i{width:35%;animation:ind 1.1s ease-in-out infinite alternate}
@keyframes ind{from{margin-left:0}to{margin-left:65%}}
.dl .st{color:var(--accent);font-weight:700}.dl .st.bad{color:#E5484D}

/* ---------- Intro ---------- */
#intro{position:fixed;inset:0;z-index:1000;background:radial-gradient(120% 80% at 50% 30%,#1b2c82 0%,#0b1038 45%,#050819 100%);overflow:hidden;perspective:900px;transition:opacity .45s ease,transform .45s ease;display:flex;align-items:center;justify-content:center}
#intro.out{opacity:0;transform:scale(1.06);pointer-events:none}
#intro .glow{position:absolute;width:560px;height:560px;left:50%;top:40%;margin:-280px 0 0 -280px;border-radius:50%;background:radial-gradient(closest-side,rgba(60,140,255,.55),rgba(120,70,255,.25) 55%,transparent 72%);opacity:0;animation:iglow 3s ease-out .1s forwards}
@keyframes iglow{0%{opacity:0;transform:scale(.4)}40%{opacity:1;transform:scale(1)}100%{opacity:.8;transform:scale(1.15)}}
#intro .pt{position:absolute;bottom:-10px;border-radius:50%;background:rgba(160,200,255,.75);opacity:0;animation:ipt linear infinite}
@keyframes ipt{0%{transform:translateY(0);opacity:0}15%{opacity:.8}100%{transform:translateY(-110vh);opacity:0}}
#intro .stage{position:relative;transform-style:preserve-3d;display:flex;flex-direction:column;align-items:center;margin-top:-30px}
#intro .lg{width:158px;height:158px;border-radius:50%;opacity:0;transform-style:preserve-3d;box-shadow:0 0 70px rgba(60,130,255,.75);animation:ilogo 1.5s cubic-bezier(.2,.8,.2,1) .15s forwards,ifloat 3s ease-in-out 1.7s infinite}
#intro .lg img{width:100%;height:100%;display:block;border-radius:50%}
@keyframes ilogo{0%{opacity:0;transform:translateZ(-700px) rotateY(-540deg) scale(.2)}55%{opacity:1}100%{opacity:1;transform:translateZ(0) rotateY(0) scale(1)}}
@keyframes ifloat{0%,100%{transform:translateY(0) rotateY(0)}50%{transform:translateY(-8px) rotateY(10deg)}}
#intro .name{display:flex;gap:6px;margin-top:38px;transform-style:preserve-3d}
#intro .name span{display:inline-block;font-size:50px;font-weight:900;font-style:italic;color:#fff;opacity:0;background:linear-gradient(180deg,#fff 25%,#9fd0ff 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 6px 14px rgba(40,110,255,.65));animation:iletter .8s cubic-bezier(.2,.9,.3,1.15) forwards;animation-delay:calc(1.15s + var(--i)*.11s)}
@keyframes iletter{0%{opacity:0;transform:translate3d(0,60px,-500px) rotateX(-110deg) rotateY(50deg)}100%{opacity:1;transform:none}}
#intro .sub{margin-top:12px;font-size:13px;font-weight:700;letter-spacing:9px;text-indent:9px;text-transform:uppercase;color:#a9c4ff;opacity:0;animation:ifade .8s ease 2.2s forwards}
@keyframes ifade{to{opacity:1}}

/* ---------- Confirm dialog ---------- */
#dlg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:80;padding:28px}
#dlg.on{display:flex}
#dlg .box{background:var(--surface);border-radius:24px;padding:22px;width:100%;max-width:340px;box-shadow:var(--shadow)}
#dlg h3{font-size:18px;margin-bottom:6px}
#dlg p{color:var(--sub);font-size:14.5px;line-height:1.45}
#dlg .acts{display:flex;gap:10px;margin-top:20px}
#dlg .acts button{flex:1;height:46px;border-radius:23px;border:1px solid var(--line);background:var(--surface2);font-weight:700;font-size:15px}
#dlg .acts .yes{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="back" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></symbol>

const THEMES=[{k:'daylight',n:'Daylight',dk:0,bg:'#F6F1E9',a:'#6C4DFF',b:'#00B8D9',s:'#fff'},{k:'sky',n:'Sky',dk:0,bg:'#EAF4FF',a:'#1E6BFF',b:'#00C2FF',s:'#fff'},{k:'midnight',n:'Midnight',dk:1,bg:'#0F1226',a:'#8B7BFF',b:'#22D3EE',s:'#1B2040'},{k:'amoled',n:'AMOLED Black',dk:1,bg:'#000',a:'#2EE6A6',b:'#7C5CFF',s:'#131315'}];

youtube:'<svg viewBox="0 0 48 48"><rect x="2" y="9" width="44" height="30" rx="10" fill="#F00"/><path d="M19.5 17.5v13l11.5-6.5z" fill="#fff"/></svg>',

  if(t.thumb)body=`<img class="th" src="${t.thumb}" alt="">`;
  else body=`<div class="ph"><div class="mark"><img src="logo.png" alt=""></div><b>${t.blank?'Pravah':esc(host(t.url))}</b></div>`;
  return `<div class="card${t.active?' act':''}" data-id="${t.id}"><div class="chead">${icon}<span class="ttl">${esc(title)}</span><button class="x" aria-label="Close tab">${ico('close')}</button></div><div class="cbody">${body}</div></div>`;
}
function renderTabs(){
  const reg=S.tabs.filter(t=>!t.priv),pri=S.tabs.filter(t=>t.priv);
  $('#n-r').textContent=reg.length;$('#n-p').textContent=pri.length;
  $('#sg-r').classList.toggle('on',!tabPriv);$('#sg-p').classList.toggle('on',tabPriv);
  $('#p-tabs').classList.toggle('privmode',tabPriv);
  const q=tabQuery.toLowerCase();
  const arr=(tabPriv?pri:reg).filter(t=>!q||((t.title||'')+' '+(t.url||'')).toLowerCase().includes(q));
  const g=$('#tgrid');g.className='tgrid'+(tabList?' list':'');
  g.innerHTML=arr.length?arr.map(cardHtml).join(''):`<div class="empty" style="grid-column:1/-1">${ico(tabPriv?'incog':'grid')}<b>${tabQuery?'No matching tabs':(tabPriv?'No private tabs':'No tabs open')}</b>${tabPriv?'Tap + to open a private tab.':'Tap + to open a new tab.'}</div>`;
  $$('#tgrid .card').forEach(attachSwipe);
}
function attachSwipe(el){
  const id=+el.dataset.id;let sx=0,sy=0,lx=0,ly=0,dx=0,dy=0,t0=0,on=false,lock=null,tgt=null;
  el.addEventListener('pointerdown',e=>{
    if(e.target.closest('.x'))return;
    on=true;lock=null;sx=lx=e.clientX;sy=ly=e.clientY;dx=dy=0;t0=Date.now();tgt=e.target;
    el.setPointerCapture(e.pointerId);el.style.transition='none';
  });
  el.addEventListener('pointermove',e=>{
    if(!on)return;
    dx=e.clientX-sx;dy=e.clientY-sy;
    if(!lock&&(Math.abs(dx)>8||Math.abs(dy)>8))lock=Math.abs(dx)>Math.abs(dy)?'x':'y';
    if(lock==='x'){el.style.transform=`translateX(${dx}px) rotate(${dx/40}deg)`;el.style.opacity=Math.max(.25,1-Math.abs(dx)/320)}
    else if(lock==='y'&&!tabList){
      if(dy<0){el.style.transform=`translateY(${dy}px)`;el.style.opacity=Math.max(.25,1-Math.abs(dy)/300)}
      else{$('#tgrid').scrollTop-=(e.clientY-ly)}
    }
    lx=e.clientX;ly=e.clientY;
  });
  const end=e=>{
    if(!on)return;on=false;
    const dt=Math.max(1,Date.now()-t0),vx=Math.abs(dx)/dt,vy=Math.abs(dy)/dt;
    el.style.transition='';
    if(lock==='x'&&(Math.abs(dx)>110||vx>.7)){fling(el,id,dx>0?'110vw':'-110vw',0)}
    else if(lock==='y'&&!tabList&&dy<0&&(dy<-90||vy>.7)){fling(el,id,0,'-110vh')}
    else{el.style.transform='';el.style.opacity='';if(!lock&&e.type==='pointerup'&&Math.abs(dx)<8&&Math.abs(dy)<8)N.switchTab(id)}
  };
  el.addEventListener('pointerup',end);
  el.addEventListener('pointercancel',end);
  el.querySelector('.x').onclick=ev=>{ev.stopPropagation();fling(el,id,0,'-60vh')};
}
function fling(el,id,x,y){
  el.style.transform=`translate(${x},${y})`;el.style.opacity='0';
  setTimeout(()=>N.closeTab(id),200);
}
$('#sg-r').onclick=()=>{tabPriv=false;renderTabs()};
$('#sg-p').onclick=()=>{tabPriv=true;renderTabs()};
$('#t-search').onclick=()=>{const f=$('#tsearch');f.classList.toggle('on');if(f.classList.contains('on'))$('#tq').focus();else{tabQuery='';$('#tq').value='';renderTabs()}};
$('#tq').oninput=e=>{tabQuery=e.target.value.trim();renderTabs()};

/* ---------- history ---------- */
function dayLabel(t){
  const d=new Date(t),n=new Date(),s=x=>new Date(x.getFullYear(),x.getMonth(),x.getDate()).getTime();
  const diff=Math.round((s(n)-s(d))/864e5);
  if(diff===0)return'Today';if(diff===1)return'Yesterday';
  return d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
}
function renderHistory(){
  const q=$('#hq2').value.trim().toLowerCase();
  const arr=S.history.filter(h=>!q||((h.title||'')+' '+h.url).toLowerCase().includes(q));
  const box=$('#hlist');
  if(!arr.length){box.innerHTML=`<div class="empty">${ico('history')}<b>${q?'No results':'No history yet'}</b>${q?'Try another search.':'Pages you visit will show up here.'}</div>`;return}
  let last='',html='';
  arr.slice(0,400).forEach(h=>{
    const g=dayLabel(h.t);if(g!==last){html+=`<div class="grp">${g}</div>`;last=g}
    const tm=new Date(h.t).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
    html+=`<div class="row" data-u="${esc(h.url)}">${fav(h.url)}<div class="mid"><div class="t">${esc(h.title||host(h.url))}</div><div class="s">${esc(host(h.url))} &middot; ${tm}</div></div><button class="rb" data-t="${h.t}" data-u="${esc(h.url)}" aria-label="Remove">${ico('close')}</button></div>`;
  });
  box.innerHTML=html;
}
$('#hq2').oninput=renderHistory;
$('#hlist').onclick=e=>{
  const rb=e.target.closest('.rb');if(rb){N.delHistory(String(rb.dataset.t),rb.dataset.u);return}
  const r=e.target.closest('.row');if(r)N.open(r.dataset.u);
};
$('#hi-clear').onclick=()=>ask('Clear history?','All browsing history will be deleted.','Clear',()=>N.clearHistory());

/* ---------- bookmarks ---------- */
function renderBookmarks(){
  const q=$('#bq').value.trim().toLowerCase();
  const arr=S.bookmarks.filter(h=>!q||((h.title||'')+' '+h.url).toLowerCase().includes(q));
  const box=$('#blist');
  if(!arr.length){box.innerHTML=`<div class="empty">${ico('star0')}<b>${q?'No results':'No bookmarks yet'}</b>${q?'Try another search.':'Open a page, then tap the menu and choose Add bookmark.'}</div>`;return}
  box.innerHTML=arr.map(h=>`<div class="row" data-u="${esc(h.url)}">${fav(h.url)}<div class="mid"><div class="t">${esc(h.title||host(h.url))}</div><div class="s">${esc(host(h.url))}</div></div><button class="rb" data-u="${esc(h.url)}" aria-label="Remove bookmark" style="color:#F5A524">${ico('star')}</button></div>`).join('');
}
$('#bq').oninput=renderBookmarks;
$('#blist').onclick=e=>{
  const rb=e.target.closest('.rb');if(rb){N.delBookmark(rb.dataset.u);return}
  const r=e.target.closest('.row');if(r)N.open(r.dataset.u);
};

/* ---------- search page ---------- */
let sug=[],sugQ='',sugTimer=0;
function renderChips(){
  $('#schips').innerHTML=Object.keys(ENG).map(k=>`<button class="chip${S.settings.engine===k?' sel':''}" data-e="${k}">${engIco(k,18)}${ENG[k].n}</button>`).join('');
}
$('#schips').onclick=e=>{const c=e.target.closest('.chip');if(c){N.setSetting('engine',c.dataset.e)}};
function submitSearch(v,eng){v=(v||'').trim();if(!v)return;$('#sq').blur();N.go(v,eng||S.settings.engine||'google')}
function renderSuggest(){
  renderChips();
  const q=$('#sq').value.trim(),ql=q.toLowerCase();
  let html='';
  if(q)html+=`<div class="row" data-q="${esc(q)}"><div class="sico">${ico('search')}</div><div class="mid"><div class="t">${esc(q)}</div><div class="s">Search ${ENG[S.settings.engine||'google'].n} or open address</div></div></div>`;
  const local=[];
  if(ql){
    [...S.bookmarks.map(x=>({...x,bm:1})),...S.history].forEach(x=>{
      if(local.length>=4||local.some(y=>y.url===x.url))return;
      if(((x.title||'')+' '+x.url).toLowerCase().includes(ql))local.push(x);
    });
  }
  local.forEach(x=>{html+=`<div class="row" data-u="${esc(x.url)}">${fav(x.url)}<div class="mid"><div class="t">${esc(x.title||host(x.url))}</div><div class="s">${esc(host(x.url))}${x.bm?' &middot; Bookmark':''}</div></div></div>`});
  if(sugQ===q)sug.filter(s=>s.toLowerCase()!==ql).slice(0,7).forEach(s=>{html+=`<div class="row" data-q="${esc(s)}"><div class="sico">${ico('search')}</div><div class="mid"><div class="t">${esc(s)}</div></div></div>`});
  if(!q){
    const recent=S.history.slice(0,6);
    if(recent.length){html+='<div class="grp">Recent</div>';recent.forEach(x=>{html+=`<div class="row" data-u="${esc(x.url)}">${fav(x.url)}<div class="mid"><div class="t">${esc(x.title||host(x.url))}</div><div class="s">${esc(host(x.url))}</div></div></div>`})}
  }
  $('#slistx').innerHTML=html;
}
$('#sq').oninput=()=>{
  const q=$('#sq').value.trim();renderSuggest();
  clearTimeout(sugTimer);if(q)sugTimer=setTimeout(()=>N.suggest(q),120);
};
$('#sq').onkeydown=e=>{if(e.key==='Enter')submitSearch($('#sq').value)};
$('#sclr').onclick=()=>{$('#sq').value='';renderSuggest();$('#sq').focus()};
$('#slistx').onclick=e=>{
  const r=e.target.closest('.row');if(!r)return;
  if(r.dataset.u)N.open(r.dataset.u);else submitSearch(r.dataset.q);
};

/* ---------- settings ---------- */
function tg(k,label,sub){return `<div class="set" data-tg="${k}"><div class="lbl">${label}${sub?`<small>${sub}</small>`:''}</div><div class="tg${getB(k)?' on':''}"></div></div>`}
function themeCard(key){return t=>`<button class="th${S.settings[key]===t.k?' sel':''}" data-th="${t.k}" data-st="${key}"><div class="pv" style="background:${t.bg}"><i style="width:70%;background:${t.a}"></i><i style="width:45%;background:${t.b}"></i><i style="width:85%;background:${t.s};border:1px solid rgba(128,128,128,.25)"></i></div><div class="nm">${t.n}${ico('check')}</div></button>`}
function renderSettings(){

  $('#slist').innerHTML=`
  <div class="sec">Theme</div>

  <div class="sec">Light style</div>
  <div class="card2"><div class="themes">${THEMES.filter(t=>!t.dk).map(themeCard('lightStyle')).join('')}</div></div>
  <div class="sec">Dark style</div>
  <div class="card2"><div class="themes">${THEMES.filter(t=>t.dk).map(themeCard('darkStyle')).join('')}</div></div>
  <div class="sec">Web pages</div>
  <div class="card2">${tg('darkPages','Dark mode for web pages','Off by default. Turns websites dark, including Google and YouTube')}</div>
  <div class="sec">Search engine</div>
  <div class="card2" style="padding:12px;display:flex;gap:8px">${Object.keys(ENG).map(k=>`<button class="eng${S.settings.engine===k?' sel':''}" data-e="${k}" style="background:var(--surface)">${engIco(k,20)}${ENG[k].n}</button>`).join('')}</div>
  <div class="sec">Privacy &amp; ads</div>
  <div class="card2">${tg('adblock','Block ads &amp; trackers','Google, YouTube and websites')}${tg('popups','Block pop-ups','Stops pages from opening new windows by themselves')}
  <button class="set danger" id="s-hist">${ico('history')}<span class="lbl">Clear history</span></button>
  <button class="set danger" id="s-data">${ico('trash')}<span class="lbl">Clear cookies &amp; cache<small>You will be signed out of websites</small></span></button></div>
  <div class="sec">Browsing</div>
  <div class="card2">${tg('desktop','Desktop site for new tabs')}
  <button class="set" id="s-dl">${ico('download')}<span class="lbl">Downloads</span></button>
  <button class="set danger" id="s-exit">${ico('power')}<span class="lbl">Exit Pravah</span></button></div>
  <div class="about"><b>Pravah Browser</b><br>Version 1.0<br>Created by Anil Yadav</div>`;
  $('#slist').scrollTop=keep;
}
$('#slist').onclick=e=>{
  const tmb=e.target.closest('[data-tm]');if(tmb){N.setSetting('themeMode',tmb.dataset.tm);return}
  const th=e.target.closest('[data-th]');if(th){N.setSetting(th.dataset.st,th.dataset.th);return}
  const en=e.target.closest('.eng');if(en){N.setSetting('engine',en.dataset.e);return}
  const t=e.target.closest('[data-tg]');if(t){const k=t.dataset.tg;N.setSetting(k,String(!getB(k)));return}
  if(e.target.closest('#s-hist'))ask('Clear history?','All browsing history will be deleted.','Clear',()=>N.clearHistory());
  if(e.target.closest('#s-data'))ask('Clear cookies & cache?','You will be signed out of websites.','Clear',()=>N.clearData());
  if(e.target.closest('#s-dl'))N.nav('downloads','');
  if(e.target.closest('#s-exit'))N.action('exit');
};

/* ---------- confirm dialog ---------- */
let dcb=null;
function ask(t,p,yes,cb){$('#dt').textContent=t;$('#dp').textContent=p;$('#dy').textContent=yes;dcb=cb;$('#dlg').classList.add('on')}
$('#dn').onclick=()=>{$('#dlg').classList.remove('on');dcb=null};
$('#dy').onclick=()=>{$('#dlg').classList.remove('on');const f=dcb;dcb=null;f&&f()};

/* ---------- menu sheet ---------- */
let menuOn=false;
function menuHtml(){
  const has=!S.blank;
  const it=(id,icon,label,opt={})=>`<button class="mi${opt.on?' on':''}" data-m="${id}" ${opt.off?'disabled':''}><span class="bubble">${ico(icon)}</span>${label}</button>`;
  const tm=S.settings.themeMode||'system';
  const seg=TMODES.map(x=>`<button class="tm${tm===x[0]?' on':''}" data-tm="${x[0]}">${ico(x[1])}${x[2]}</button>`).join('');
  return `<div class="grab"></div>
  <div class="mrow"><span>Theme</span><div class="seg3">${seg}</div></div>
  <div class="mgrid">
    ${it('newtab','plus','New tab')}${it('private','incog','Private tab')}${it('bookmarks','star','Bookmarks')}${it('history','history','History')}
    ${it('downloads','download','Downloads')}${it('darkpages','moon','Dark pages',{on:getB('darkPages')})}${it('desktop','desktop','Desktop site',{off:!has,on:S.desktop})}${it('bookmark',S.bookmarked?'star':'star0',S.bookmarked?'Bookmarked':'Add bookmark',{off:!has,on:S.bookmarked})}
    ${it('share','share','Share',{off:!has})}${it('reload','refresh','Reload',{off:!has})}${it('home','home','Start page')}${it('settings','tune','Settings')}
  </div>`;
}
function openMenu(){menuOn=true;$('#sheet').innerHTML=menuHtml();requestAnimationFrame(()=>requestAnimationFrame(()=>$('#scrim').classList.add('on')))}
function closeMenu(notify){if(!menuOn)return;menuOn=false;$('#scrim').classList.remove('on');if(notify!==false)setTimeout(()=>N.closeMenu(),230)}
$('#scrim').onclick=e=>{
  if(e.target.id==='scrim'){closeMenu();return}
  const tmb=e.target.closest('[data-tm]');if(tmb){N.setSetting('themeMode',tmb.dataset.tm);return}
  const m=e.target.closest('.mi');if(!m||m.disabled)return;
  const id=m.dataset.m;
  if(id==='newtab')N.newTab(false);else if(id==='private')N.newTab(true);
  else if(id==='darkpages')N.setSetting('darkPages',String(!getB('darkPages')));
  else if(['bookmarks','history','settings','downloads'].includes(id))N.nav(id,'');
  else N.action(id);
  closeMenu();
};

/* ---------- downloads ---------- */
let dlFilter='all',dlLast='';
const CAT=n=>{const e=(String(n).split('.').pop()||'').toLowerCase();
  if(['mp4','mkv','webm','avi','mov','3gp','flv','m4v'].includes(e))return'video';
  if(['jpg','jpeg','png','gif','webp','bmp','heic','svg'].includes(e))return'image';
  if(['mp3','m4a','wav','aac','ogg','flac','opus'].includes(e))return'audio';
  if(['pdf','doc','docx','xls','xlsx','ppt','pptx','txt','csv','epub','rtf'].includes(e))return'doc';
  if(e==='apk')return'app';
  if(['zip','rar','7z','tar','gz'].includes(e))return'zip';
  return'file'};
const bytes=n=>{if(!(n>0))return'';const u=['B','KB','MB','GB'];let i=0;while(n>=1024&&i<3){n/=1024;i++}return(i?n.toFixed(n<10?1:0):Math.round(n))+' '+u[i]};
function dlRow(d){
  const cat=CAT(d.name),ext=((d.name.split('.').length>1?d.name.split('.').pop():'')||'FILE').slice(0,4).toUpperCase();
  const pct=d.total>0?Math.min(100,Math.round(d.done*100/d.total)):0;
  let sub,bar='',btns='';
  const ib=(a,i)=>`<button class="rb" data-a="${a}" aria-label="${a}">${ico(i)}</button>`;
  if(d.status==='done'){
    const tm=new Date(d.t).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
    sub=`${bytes(d.total)||'Downloaded'} &middot; ${dayLabel(d.t)}, ${tm}`;btns=ib('share','share')+ib('del','trash');
  }else if(d.status==='failed'){
    sub='<span class="st bad">Failed</span> &middot; Tap retry';btns=ib('retry','refresh')+ib('del','trash');
  }else{
    const lbl=d.status==='paused'?'Paused':d.status==='pending'?'Waiting':(d.total>0?pct+'%':'Downloading');
    sub=`<span class="st">${lbl}</span>${d.done>0?' &middot; '+bytes(d.done)+(d.total>0?' of '+bytes(d.total):''):''}`;
    bar=`<div class="bar${d.total>0?'':' ind'}"><i style="width:${d.total>0?pct:35}%"></i></div>`;
    btns=ib('cancel','close');
  }
  return `<div class="row dl" data-id="${esc(d.id)}" data-s="${d.status}"><div class="ft ${cat}">${esc(ext)}</div><div class="mid"><div class="t">${esc(d.name)}</div><div class="s">${sub}</div>${bar}</div>${btns}</div>`;
}
function renderDownloads(){
  const chips=[['all','All'],['video','Videos'],['image','Images'],['doc','Documents'],['app','Apps']];
  $('#dl-chips').innerHTML=chips.map(c=>`<button class="chip${dlFilter===c[0]?' sel':''}" data-f="${c[0]}">${c[1]}</button>`).join('');
  const arr=S.downloads.filter(d=>dlFilter==='all'||CAT(d.name)===dlFilter);
  const box=$('#dl-list');
  if(!arr.length){box.innerHTML=`<div class="empty">${ico('download')}<b>${S.downloads.length?'Nothing in this category':'No downloads yet'}</b>${S.downloads.length?'Try another filter.':'Files you download will show up here.'}</div>`;return}
  box.innerHTML=arr.map(dlRow).join('');
}
$('#dl-chips').onclick=e=>{const c=e.target.closest('.chip');if(c){dlFilter=c.dataset.f;dlLast='';renderDownloads()}};
$('#dl-list').onclick=e=>{
  const row=e.target.closest('.dl');if(!row)return;
  const id=row.dataset.id,b=e.target.closest('.rb');
  if(b){
    const a=b.dataset.a;
    if(a==='share')N.dlShare(id);
    else if(a==='retry')N.dlRetry(id);
    else if(a==='cancel')N.dlDelete(id);
    else if(a==='del')ask('Delete file?','The file will be removed from your phone.','Delete',()=>N.dlDelete(id));
    return;
  }
  if(row.dataset.s==='done')N.dlOpen(id);
  else if(row.dataset.s==='failed')N.dlRetry(id);
};
$('#dl-clear').onclick=()=>ask('Clear list?','Finished downloads are removed from this list. The files stay on your phone.','Clear',()=>N.dlClear());

/* ---------- intro ---------- */
(function(){
  const el=$('#intro');
  $('#intro .name').innerHTML='PRAVAH'.split('').map((c,i)=>`<span style="--i:${i}">${c}</span>`).join('');
  let pts='';for(let i=0;i<18;i++){const s=2+Math.random()*4;pts+=`<i class="pt" style="left:${Math.random()*100}%;width:${s}px;height:${s}px;animation-duration:${3+Math.random()*3}s;animation-delay:${Math.random()*2}s"></i>`}
  $('#intro .pts').innerHTML=pts;
  let fin=false;
  function end(){if(fin)return;fin=true;el.classList.add('out');setTimeout(()=>{el.remove();N.introDone()},450)}
  window.Intro={skip:end};
  el.onclick=end;
  setTimeout(end,3500);
})();

/* ---------- native -> UI ---------- */
function onEnter(m){
  if(m==='tabs'){tabPriv=!!(S.tabs.find(t=>t.active)||{}).priv;tabQuery='';$('#tq').value='';$('#tsearch').classList.remove('on')}
  if(m==='search'){$('#sq').value=S.arg||'';sug=[];sugQ='';renderSuggest();setTimeout(()=>{$('#sq').focus();$('#sq').select()},60)}
  if(m==='history'){$('#hq2').value=''}
  if(m==='downloads'){dlFilter='all';dlLast='';renderDownloads()}
  if(m==='bookmarks'){$('#bq').value=''}
  if(m!=='home')$('#hq').blur();
}
const PAGES={home:'p-home',tabs:'p-tabs',history:'p-history',bookmarks:'p-bookmarks',settings:'p-settings',search:'p-search',downloads:'p-downloads'};
window.App={
  setState(o){
    const pm=S.mode;
    if(o.settings)o.settings=Object.assign({},S.settings,o.settings);
    Object.assign(S,o);
    document.documentElement.dataset.theme=S.theme;
    if(pm!==S.mode){
      $$('.page').forEach(p=>p.classList.remove('on'));
      const id=PAGES[S.mode];if(id)$('#'+id).classList.add('on');
      onEnter(S.mode);
    }
    renderBar();
    if(S.mode==='tabs')renderTabs();
    else if(S.mode==='history')renderHistory();
    else if(S.mode==='bookmarks')renderBookmarks();
    else if(S.mode==='downloads')renderDownloads();
    else if(S.mode==='settings')renderSettings();
    else if(S.mode==='search')renderSuggest();
    updateHome();
    if(menuOn)$('#sheet').innerHTML=menuHtml();
  },
  setTheme(t){S.theme=t;document.documentElement.dataset.theme=t},
  setDownloads(a){const j=JSON.stringify(a);S.downloads=a||[];if(S.mode==='downloads'&&j!==dlLast){dlLast=j;renderDownloads()}},
  openMenu,closeMenu:()=>closeMenu(false),
  suggestions(q,arr){sugQ=q;sug=arr||[];if(S.mode==='search'&&$('#sq').value.trim()===q)renderSuggest()}
};
</script>
